<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko Creole - Learn Mauritian Creole</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #f7fee7;
    }
  </style>
</head>
<body class="bg-lime-50 text-slate-800">

  <!-- React Mount Root -->
  <div id="root"></div>

  <!-- Standard Vanilla React Code (No Babel needed) -->
  <script>
    const e = React.createElement;
    const { useState, useEffect } = React;

    const COURSE_UNITS = [
      {
        id: 1,
        title: "Unit 1: Fonksyon di Baze",
        description: "Essential greetings & pronouns",
        color: "bg-emerald-500",
        lessons: [
          {
            id: "u1l1",
            title: "Greetings & Introductions",
            exercises: [
              {
                type: "mc",
                question: "How do you say 'Hello / Good morning' in Mauritian Creole?",
                options: ["Bonswar", "Bonzur", "Ki manyer", "Mersi"],
                answer: "Bonzur"
              },
              {
                type: "sentence",
                question: "Translate: 'My name is Sarah'",
                words: ["Mo", "apel", "Sarah", "To", "bonzur"],
                answer: ["Mo", "apel", "Sarah"]
              },
              {
                type: "voice",
                phrase: "Bonzur, mo apel Sarah",
                phonetic: "bohn-zoor, moh ah-pel Sarah",
                translation: "Hello, my name is Sarah"
              }
            ]
          },
          {
            id: "u1l2",
            title: "Tense Markers (Pe, Ti, Pou)",
            exercises: [
              {
                type: "mc",
                question: "Which marker indicates an action happening RIGHT NOW (Present Continuous)?",
                options: ["ti", "pou", "pe", "pa"],
                answer: "pe"
              },
              {
                type: "sentence",
                question: "Build: 'I am eating rice'",
                words: ["Mo", "pe", "manze", "diri", "ti", "pou"],
                answer: ["Mo", "pe", "manze", "diri"]
              },
              {
                type: "voice",
                phrase: "Mo pe manze diri",
                phonetic: "moh pay man-zay dee-ree",
                translation: "I am eating rice"
              }
            ]
          }
        ]
      },
      {
        id: 2,
        title: "Unit 2: Survi dan Moris",
        description: "Transport, directions & market bargaining",
        color: "bg-amber-500",
        lessons: [
          {
            id: "u2l1",
            title: "Transport & Directions",
            exercises: [
              {
                type: "mc",
                question: "How do you ask 'Where is the bus stop?'",
                options: ["Kot bis stop la?", "Ki pri sa bis-la?", "Bis-la tro ser!", "Mo pe al bistro."],
                answer: "Kot bis stop la?"
              },
              {
                type: "sentence",
                question: "Translate: 'Where are you going?'",
                words: ["Kot", "to", "pe", "ale?", "ki", "kifer"],
                answer: ["Kot", "to", "pe", "ale?"]
              }
            ]
          },
          {
            id: "u2l2",
            title: "Shopping & Market Bargaining",
            exercises: [
              {
                type: "mc",
                question: "What does 'Li tro ser!' mean at the market?",
                options: ["It's very delicious!", "It's too expensive!", "It's too cheap!", "Give me two!"],
                answer: "It's too expensive!"
              },
              {
                type: "voice",
                phrase: "Ki pri sa gato pima la?",
                phonetic: "kee pree sah gah-toh pee-mah lah",
                translation: "What is the price of this chili cake?"
              }
            ]
          }
        ]
      }
    ];

    function App() {
      const [xp, setXp] = useState(() => Number(localStorage.getItem("kreol_xp")) || 0);
      const [hearts, setHearts] = useState(() => Number(localStorage.getItem("kreol_hearts")) || 5);
      const [streak, setStreak] = useState(() => Number(localStorage.getItem("kreol_streak")) || 1);
      const [gems, setGems] = useState(() => Number(localStorage.getItem("kreol_gems")) || 100);

      const [activeLesson, setActiveLesson] = useState(null);
      const [exerciseIndex, setExerciseIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState("");
      const [constructedSentence, setConstructedSentence] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [isListening, setIsListening] = useState(false);
      const [speechResult, setSpeechResult] = useState("");

      useEffect(() => {
        localStorage.setItem("kreol_xp", xp);
        localStorage.setItem("kreol_hearts", hearts);
        localStorage.setItem("kreol_streak", streak);
        localStorage.setItem("kreol_gems", gems);
      }, [xp, hearts, streak, gems]);

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'fr-FR';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      const startVoiceRecognition = (targetPhrase) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech recognition is not supported on this browser. Use Google Chrome on Android!");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "fr-FR";
        recognition.interimResults = false;

        setIsListening(true);
        recognition.start();

        recognition.onresult = (event) => {
          const spokenText = event.results[0][0].transcript.toLowerCase();
          setSpeechResult(spokenText);
          setIsListening(false);

          if (spokenText.includes(targetPhrase.toLowerCase()) || spokenText.length > 0) {
            setFeedback("correct");
            setXp(prev => prev + 15);
          } else {
            setFeedback("incorrect");
            setHearts(prev => Math.max(0, prev - 1));
          }
        };

        recognition.onerror = () => {
          setIsListening(false);
          alert("Could not catch speech clearly. Please try again!");
        };
      };

      const handleNextExercise = () => {
        if (exerciseIndex + 1 < activeLesson.exercises.length) {
          setExerciseIndex(prev => prev + 1);
          setFeedback(null);
          setSelectedOption("");
          setConstructedSentence([]);
          setSpeechResult("");
        } else {
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
          setXp(prev => prev + 50);
          setGems(prev => prev + 20);
          setActiveLesson(null);
          setExerciseIndex(0);
          setFeedback(null);
        }
      };

      const checkAnswer = (currentEx) => {
        if (currentEx.type === "mc") {
          if (selectedOption === currentEx.answer) {
            setFeedback("correct");
            setXp(prev => prev + 10);
          } else {
            setFeedback("incorrect");
            setHearts(prev => Math.max(0, prev - 1));
          }
        } else if (currentEx.type === "sentence") {
          if (constructedSentence.join(" ") === currentEx.answer.join(" ")) {
            setFeedback("correct");
            setXp(prev => prev + 15);
          } else {
            setFeedback("incorrect");
            setHearts(prev => Math.max(0, prev - 1));
          }
        }
      };

      return e("div", { className: "min-h-screen max-w-md mx-auto bg-white border-x border-slate-200 flex flex-col justify-between shadow-lg" },
        // Header
        e("header", { className: "sticky top-0 bg-white z-10 border-b border-slate-200 p-4 flex justify-between items-center text-lg font-bold" },
          e("div", { className: "flex items-center space-x-1 text-amber-500" }, e("span", null, "🔥"), e("span", null, streak)),
          e("div", { className: "flex items-center space-x-1 text-emerald-500" }, e("span", null, "⚡"), e("span", null, `${xp} XP`)),
          e("div", { className: "flex items-center space-x-1 text-cyan-500" }, e("span", null, "💎"), e("span", null, gems)),
          e("div", { className: "flex items-center space-x-1 text-rose-500" }, e("span", null, "❤️"), e("span", null, hearts))
        ),

        // Main Body
        e("main", { className: "flex-1 p-4 flex flex-col justify-center" },
          !activeLesson
            ? e("div", { className: "space-y-6" },
                e("div", { className: "text-center bg-lime-100 p-4 rounded-2xl border-2 border-lime-300" },
                  e("h1", { className: "text-2xl font-bold text-lime-900" }, "Bonzur! 👋"),
                  e("p", { className: "text-lime-700 text-sm mt-1" }, "Anou aprann Kreol Morisien!")
                ),
                COURSE_UNITS.map(unit =>
                  e("div", { key: unit.id, className: "space-y-4" },
                    e("div", { className: `${unit.color} text-white p-4 rounded-2xl shadow-md` },
                      e("h2", { className: "text-xl font-bold" }, unit.title),
                      e("p", { className: "text-sm opacity-90" }, unit.description)
                    ),
                    e("div", { className: "flex flex-col items-center space-y-4 py-2" },
                      unit.lessons.map(lesson =>
                        e("button", {
                          key: lesson.id,
                          onClick: () => {
                            setActiveLesson(lesson);
                            setExerciseIndex(0);
                            setFeedback(null);
                          },
                          className: "w-20 h-20 bg-lime-500 hover:bg-lime-600 active:scale-95 text-white rounded-full font-bold shadow-lg flex items-center justify-center border-b-4 border-lime-700 transition"
                        }, e("span", { className: "text-2xl" }, "⭐"))
                      )
                    )
                  )
                )
              )
            : e("div", { className: "flex-1 flex flex-col justify-between" },
                e("div", null,
                  e("div", { className: "flex justify-between items-center mb-6" },
                    e("button", {
                      onClick: () => setActiveLesson(null),
                      className: "text-slate-400 font-bold hover:text-slate-600"
                    }, "✕ Exit"),
                    e("div", { className: "w-2/3 bg-slate-200 h-3 rounded-full overflow-hidden" },
                      e("div", {
                        className: "bg-lime-500 h-full transition-all duration-300",
                        style: { width: `${((exerciseIndex + 1) / activeLesson.exercises.length) * 100}%` }
                      })
                    )
                  ),

                  // Exercises
                  (() => {
                    const ex = activeLesson.exercises[exerciseIndex];
                    if (ex.type === "mc") {
                      return e("div", { className: "space-y-4" },
                        e("h2", { className: "text-xl font-bold text-slate-800" }, ex.question),
                        e("div", { className: "grid grid-cols-1 gap-3 mt-4" },
                          ex.options.map((opt, i) =>
                            e("button", {
                              key: i,
                              onClick: () => setSelectedOption(opt),
                              className: `p-4 rounded-xl font-bold border-2 text-left transition ${
                                selectedOption === opt
                                  ? "border-lime-500 bg-lime-50 text-lime-800"
                                  : "border-slate-200 hover:bg-slate-50"
                              }`
                            }, opt)
                          )
                        )
                      );
                    }

                    if (ex.type === "sentence") {
                      return e("div", { className: "space-y-4" },
                        e("h2", { className: "text-xl font-bold text-slate-800" }, ex.question),
                        e("div", { className: "min-h-[60px] p-3 border-b-2 border-slate-300 flex flex-wrap gap-2 items-center" },
                          constructedSentence.map((word, i) =>
                            e("button", {
                              key: i,
                              onClick: () => setConstructedSentence(prev => prev.filter((_, idx) => idx !== i)),
                              className: "bg-lime-500 text-white font-bold px-3 py-1.5 rounded-lg border-b-2 border-lime-700 active:scale-95"
                            }, word)
                          )
                        ),
                        e("div", { className: "flex flex-wrap gap-2 mt-6" },
                          ex.words.map((word, i) =>
                            e("button", {
                              key: i,
                              onClick: () => setConstructedSentence(prev => [...prev, word]),
                              className: "bg-white border-2 border-slate-200 hover:bg-slate-50 font-bold px-3 py-1.5 rounded-lg shadow-sm active:scale-95"
                            }, word)
                          )
                        )
                      );
                    }

                    if (ex.type === "voice") {
                      return e("div", { className: "space-y-6 text-center" },
                        e("h2", { className: "text-xl font-bold text-slate-800" }, "Speak this phrase aloud:"),
                        e("div", { className: "bg-amber-50 p-6 rounded-2xl border-2 border-amber-200 space-y-2" },
                          e("p", { className: "text-2xl font-bold text-amber-900" }, ex.phrase),
                          e("p", { className: "text-sm text-amber-700 italic" }, `"${ex.phonetic}"`),
                          e("p", { className: "text-xs text-slate-500" }, `English: ${ex.translation}`),
                          e("button", {
                            onClick: () => speakText(ex.phrase),
                            className: "mt-2 bg-amber-200 hover:bg-amber-300 text-amber-900 px-3 py-1 rounded-full text-xs font-bold"
                          }, "🔊 Listen Audio")
                        ),
                        e("button", {
                          onClick: () => startVoiceRecognition(ex.phrase),
                          className: `w-24 h-24 rounded-full font-bold text-3xl shadow-lg mx-auto flex items-center justify-center transition border-b-4 ${
                            isListening
                              ? "bg-rose-500 text-white border-rose-700 animate-pulse"
                              : "bg-cyan-500 text-white border-cyan-700 hover:bg-cyan-600"
                          }`
                        }, "🎙️"),
                        speechResult && e("p", { className: "text-sm text-slate-500" }, `Heard: "${speechResult}"`)
                      );
                    }
                  })()
                ),

                // Feedback Bar
                e("div", { className: "mt-8" },
                  feedback === "correct" && e("div", { className: "bg-emerald-100 border-2 border-emerald-400 p-4 rounded-xl mb-4 text-emerald-800 font-bold" }, "🎉 Tre bon! (Very good!) +15 XP"),
                  feedback === "incorrect" && e("div", { className: "bg-rose-100 border-2 border-rose-400 p-4 rounded-xl mb-4 text-rose-800 font-bold" }, "❌ Escuze! Keep practicing! -1 Heart"),
                  feedback === null
                    ? e("button", {
                        onClick: () => checkAnswer(activeLesson.exercises[exerciseIndex]),
                        className: "w-full bg-lime-500 hover:bg-lime-600 text-white font-bold py-3.5 rounded-xl border-b-4 border-lime-700 shadow-md active:scale-98 transition"
                      }, "CHECK")
                    : e("button", {
                        onClick: handleNextExercise,
                        className: "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl border-b-4 border-emerald-700 shadow-md active:scale-98 transition"
                      }, "CONTINUE")
                )
              )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
